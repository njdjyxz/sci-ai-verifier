[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-ai-verifier"
version = "0.5.0"
description = "General safe-skill demos and bounded scientific verification in Claude Desktop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sci-ai-verifier = "sci_ai_verifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
