[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-ai-verifier"
version = "0.1.0"
description = "Scientific claim extraction and verification workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
]

[project.scripts]
sci-ai-verifier = "sci_ai_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

