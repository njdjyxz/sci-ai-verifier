[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-ai-verifier"
version = "0.2.0"
description = "Deterministic Stage 2 tools for the Scientific Verifier Claude Desktop skill"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sci-ai-verifier = "sci_ai_verifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
